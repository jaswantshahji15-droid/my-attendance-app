<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Worker Attendance & Wages System</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h2, h3 {
            color: #2c3e50;
            margin-top: 0;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            font-size: 1.3rem;
        }
        .grid-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #e9ecef;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #495057;
        }
        input, select {
            padding: 8px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #3498db;
        }
        
        /* Search Box Special Styling */
        .search-container {
            margin: 15px 0;
            background: #eef2f7;
            padding: 12px;
            border-radius: 8px;
            border-left: 5px solid #3498db;
        }
        .search-input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #b2bec3;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
        }

        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover { background-color: #27ae60; }
        .btn-submit { background-color: #3498db; }
        .btn-submit:hover { background-color: #2980b9; }
        
        .table-responsive {
            overflow-x: auto;
            margin-top: 15px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
            white-space: nowrap;
        }
        th {
            background-color: #34495e;
            color: white;
            padding: 10px;
            font-weight: 600;
        }
        td {
            padding: 10px;
            border-bottom: 1px solid #dee2e6;
        }
        tr:hover { background-color: #f1f3f5; }
        
        .badge {
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge-full { background-color: #d4edda; color: #155724; }
        .badge-half { background-color: #fff3cd; color: #856404; }
        .badge-absent { background-color: #f8d7da; color: #721c24; }
        
        .actions-btn {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .btn-download { background-color: #e67e22; }
        .btn-download:hover { background-color: #d35400; }
        .btn-delete { background-color: #e74c3c; padding: 4px 8px; font-size: 11px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📋 Attendance & Payroll (Mobile App)</h2>
    
    <h3>1. Attendance / Wages Entry</h3>
    <div class="grid-form">
        <div class="form-group">
            <label>Select Date</label>
            <input type="date" id="wDate">
        </div>
        <div class="form-group">
            <label>Worker Name</label>
            <input type="text" id="wName" placeholder="Ramesh Kumar">
        </div>
        <div class="form-group">
            <label>Per Day Wages (₹)</label>
            <input type="number" id="wDayRate" value="500">
        </div>
        <div class="form-group">
            <label>OT Rate/Hour (₹)</label>
            <input type="number" id="wHourRate" value="70">
        </div>
        <div class="form-group">
            <label>Attendance Status</label>
            <select id="wAttendance" onchange="checkAttendanceType()">
                <option value="Full Day">Full Day</option>
                <option value="Half Day">Half Day</option>
                <option value="Absent">Absent</option>
            </select>
        </div>
        <div class="form-group timing-field">
            <label>In Time</label>
            <input type="time" id="wInTime" value="09:00">
        </div>
        <div class="form-group timing-field">
            <label>Lunch Out</label>
            <input type="time" id="wLunchOut" value="13:00">
        </div>
        <div class="form-group timing-field">
            <label>Lunch In</label>
            <input type="time" id="wLunchIn" value="14:00">
        </div>
        <div class="form-group timing-field">
            <label>Out Time</label>
            <input type="time" id="wOutTime" value="18:00">
        </div>
        <div class="form-group">
            <label>OT Hours (Manual)</label>
            <input type="number" id="wOvertimeHours" value="0" min="0">
        </div>
        <div class="form-group">
            <label>Advance Given (₹)</label>
            <input type="number" id="wAdvance" value="0">
        </div>
        <div class="form-group" style="justify-content: flex-end;">
            <button class="btn-submit" onclick="addAttendanceRecord()">Save Data</button>
        </div>
    </div>

    <h3>2. Attendance Register & Sheet</h3>
    
    <div class="search-container">
        <label style="font-size: 13px; margin-bottom: 5px; display: block;">🔍 Worker Name ya Date se Search Karein:</label>
        <input type="text" id="wSearch" class="search-input" placeholder="Type name or date (e.g. Ramesh or 01-06-2026)..." onkeyup="renderTable()">
    </div>

    <div class="actions-btn">
        <button class="btn-download" onclick="exportToCSV()">💾 Download Excel (CSV)</button>
        <button style="background-color: #c0392b;" onclick="clearAllData()">🗑️ Clear All Data</button>
    </div>
    
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Name</th>
                    <th>Day Rate</th>
                    <th>OT /Hr</th>
                    <th>Status</th>
                    <th>In/Out</th>
                    <th>Lunch</th>
                    <th>OT Hrs</th>
                    <th>Base ₹</th>
                    <th>OT ₹</th>
                    <th>Gross Total</th>
                    <th>Advance (-)</th>
                    <th>Net Payable</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="attendanceTableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    let payrollData = JSON.parse(localStorage.getItem('payroll_records')) || [];

    window.onload = function() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('wDate').value = today;
        renderTable();
    };

    function checkAttendanceType() {
        const type = document.getElementById('wAttendance').value;
        const timingFields = document.querySelectorAll('.timing-field input');
        if(type === 'Absent') {
            timingFields.forEach(f => f.disabled = true);
            document.getElementById('wOvertimeHours').value = 0;
            document.getElementById('wOvertimeHours').disabled = true;
        } else {
            timingFields.forEach(f => f.disabled = false);
            document.getElementById('wOvertimeHours').disabled = false;
        }
    }

    function addAttendanceRecord() {
        const date = document.getElementById('wDate').value;
        const name = document.getElementById('wName').value.trim();
        const dayRate = parseFloat(document.getElementById('wDayRate').value) || 0;
        const hourRate = parseFloat(document.getElementById('wHourRate').value) || 0;
        const status = document.getElementById('wAttendance').value;
        
        const inTime = document.getElementById('wInTime').value;
        const lunchOut = document.getElementById('wLunchOut').value;
        const lunchIn = document.getElementById('wLunchIn').value;
        const outTime = document.getElementById('wOutTime').value;
        
        const otHours = parseFloat(document.getElementById('wOvertimeHours').value) || 0;
        const advance = parseFloat(document.getElementById('wAdvance').value) || 0;

        if(!date) { alert("Kripya Date select karein!"); return; }
        if(!name) { alert("Kripya Worker ka Naam daalein!"); return; }

        let baseWages = status === 'Full Day' ? dayRate : (status === 'Half Day' ? dayRate / 2 : 0);
        let otWages = otHours * hourRate;
        let grossWages = baseWages + otWages;
        let netPayable = grossWages - advance;

        const formattedDate = date.split('-').reverse().join('-');

        const record = {
            id: Date.now(),
            date: formattedDate,
            name, dayRate, hourRate, status,
            timings: status !== 'Absent' ? `${inTime}-${outTime}` : '-',
            lunch: status !== 'Absent' ? `${lunchOut}-${lunchIn}` : '-',
            otHours: status !== 'Absent' ? otHours : 0,
            baseWages, otWages, grossWages, advance, netPayable
        };

        payrollData.push(record);
        localStorage.setItem('payroll_records', JSON.stringify(payrollData));
        
        document.getElementById('wName').value = '';
        document.getElementById('wAdvance').value = '0';
        document.getElementById('wOvertimeHours').value = '0';
        
        renderTable();
    }

    function deleteRecord(id) {
        if(confirm("Kya aap is entry ko delete karna chahte hain?")) {
            payrollData = payrollData.filter(r => r.id !== id);
            localStorage.setItem('payroll_records', JSON.stringify(payrollData));
            renderTable();
        }
    }

    function renderTable() {
        const tbody = document.getElementById('attendanceTableBody');
        tbody.innerHTML = '';
        
        // Search term read karein
        const searchQuery = document.getElementById('wSearch').value.toLowerCase().trim();

        // Data ko reverse karke filter karein
        const filteredData = [...payrollData].reverse().filter(r => {
            return r.name.toLowerCase().includes(searchQuery) || r.date.includes(searchQuery);
        });

        filteredData.forEach((r) => {
            let badgeClass = r.status === 'Full Day' ? 'badge-full' : (r.status === 'Half Day' ? 'badge-half' : 'badge-absent');

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${r.date}</td>
                <td style="font-weight:bold;">${r.name}</td>
                <td>₹${r.dayRate}</td>
                <td>₹${r.hourRate}</td>
                <td><span class="badge ${badgeClass}">${r.status}</span></td>
                <td>${r.timings}</td>
                <td>${r.lunch}</td>
                <td>${r.otHours} hrs</td>
                <td>₹${r.baseWages.toFixed(0)}</td>
                <td>₹${r.otWages.toFixed(0)}</td>
                <td style="color:#2980b9; font-weight:600;">₹${r.grossWages.toFixed(0)}</td>
                <td style="color:#c0392b;">₹${r.advance.toFixed(0)}</td>
                <td style="background-color:#e8f8f5; font-weight:bold; color:#27ae60;">₹${r.netPayable.toFixed(0)}</td>
                <td><button class="btn-delete" onclick="deleteRecord(${r.id})">❌</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function clearAllData() {
        if(confirm("⚠️ WARNING: Kya aap saara ka saara records hamesha ke liye delete karna chahte hain?")) {
            payrollData = [];
            localStorage.removeItem('payroll_records');
            renderTable();
        }
    }

    function exportToCSV() {
        if(payrollData.length === 0) {
            alert("No data to download!");
            return;
        }
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
        csvContent += "Date,Worker Name,Day Rate,OT Rate/Hr,Status,In-Out Time,Lunch Break,OT Hours,Base Wages,OT Wages,Gross Total,Advance Less,Net Payable\n";

        payrollData.forEach(r => {
            csvContent += `"${r.date}","${r.name}",${r.dayRate},${r.hourRate},"${r.status}","${r.timings}","${r.lunch}",${r.otHours},${r.baseWages},${r.otWages},${r.grossWages},${r.advance},${r.netPayable}\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Worker_Report_All_Dates.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
