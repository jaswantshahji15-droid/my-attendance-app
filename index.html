<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shramik Sync Master Ultimate v12.6</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f1f5f9; margin: 0; padding: 10px; color: #1e293b; }
        .master-container { max-width: 100%; margin: 0 auto; background: #ffffff; padding: 18px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); box-sizing: border-box; }
        
        .header-block { text-align: center; margin-bottom: 15px; }
        .main-title { width: 100%; border: none; background: transparent; text-align: center; font-size: 24px; font-weight: 800; color: #0f172a; padding: 4px; box-sizing: border-box; }
        .workspace-badge { text-align: center; font-weight: 700; color: #2563eb; font-size: 14px; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px; }
        
        .status-panel { padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: 700; font-size: 13px; text-align: center; }
        .status-online { color: #15803d; background: #dcfce7; border: 1px solid #bbf7d0; }

        .config-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        .config-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .config-row label { font-size: 12px; font-weight: 700; color: #475569; }
        .config-row input, .config-row select { padding: 8px; font-size: 13px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; }
        
        .section-title { font-size: 15px; font-weight: 700; color: #0f172a; margin: 18px 0 10px 0; border-left: 4px solid #2563eb; padding-left: 8px; display: flex; justify-content: space-between; align-items: center; }
        .inputs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 10px; background: #ffffff; border: 1px solid #e2e8f0; padding: 14px; border-radius: 8px; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 11px; font-weight: 700; margin-bottom: 4px; color: #475569; text-transform: uppercase; }
        .input-group input, .input-group select { padding: 7px; font-size: 13px; border: 1px solid #cbd5e1; border-radius: 6px; height: 36px; box-sizing: border-box; outline: none; }
        
        .action-btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 13px; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
        .btn-submit { background: #16a34a; color: white; width: 100%; margin-top: 12px; height: 42px; font-size: 15px; border-radius: 8px; }
        .btn-submit:hover { background: #15803d; }
        .btn-rename { background: #2563eb; color: white; padding: 4px 10px; font-size: 11px; border-radius: 4px; }
        .btn-purge { background: #dc2626; color: white; height: 36px; }
        .btn-excel { background: #0f766e; color: white; margin-left: auto; padding: 6px 12px; font-size: 12px; }

        .block-tabs { display: flex; gap: 6px; margin: 12px 0; overflow-x: auto; }
        .tab-btn { background: #e2e8f0; color: #475569; padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 700; border: none; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: #2563eb; color: white; }

        .grid-scroller { overflow-x: auto; margin-top: 8px; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 1200px; }
        th, td { border: 1px solid #e2e8f0; padding: 6px; text-align: center; vertical-align: top; box-sizing: border-box; }
        th { background: #f8fafc; font-weight: 700; color: #475569; border-bottom: 2px solid #cbd5e1; height: 32px; }
        .fixed-worker-cell { text-align: left; background: #f8fafc; font-weight: 700; min-width: 165px; border-right: 2px solid #cbd5e1; position: sticky; left: 0; z-index: 1; }
        
        .cell-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 4px; border-radius: 4px; font-size: 10px; text-align: left; margin-top: 4px; line-height: 1.3; color: #334155; }
        .advance-tag { color: #dc2626; font-weight: 800; font-size: 9px; margin-top: 3px; background: #fee2e2; border: 1px solid #fca5a5; padding: 1px 2px; border-radius: 3px; text-align: center; }
        
        .status-badge { font-weight: 800; padding: 2px 5px; border-radius: 4px; font-size: 9px; display: inline-block; }
        .badge-P { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .badge-HD { background: #fef9c3; color: #854d0e; border: 1px solid #fef08a; }
        .badge-PP { background: #f3e8ff; color: #6b21a8; border: 1px solid #e9d5ff; }
        .badge-A { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

        .summary-column { background: #f0fdf4; text-align: left; border-left: 2px solid #cbd5e1; padding: 8px; min-width: 170px; }
        .purge-panel { background: #fff5f5; border: 1px solid #fee2e2; padding: 14px; border-radius: 8px; margin-top: 25px; }
    </style>
</head>
<body>

<div class="master-container">
    <div class="header-block">
        <input type="text" id="appTitleText" class="main-title" value="Performance Register System v12.6" oninput="persistAppTitle()">
    </div>
    <div id="activeWorkspaceBadge" class="workspace-badge">Active Block: Loading Site...</div>
    <div id="cloudSyncStatus" class="status-panel status-online">🟢 Connection Active • Shramik Live Sync Engine</div>

    <div class="config-box">
        <div class="config-row">
            <label>📍 Select Site Area:</label>
            <select id="activeSiteSelector" onchange="engageSiteWorkspaceSwitch()" style="font-weight: bold; color: #2563eb;">
                <option value="site1" id="opt_site1">Site 1</option>
                <option value="site2" id="opt_site2">Site 2 (10-Day Auto Block Payment)</option>
                <option value="site3">Site 3</option>
                <option value="site4">Site 4</option>
                <option value="site5">Site 5</option>
            </select>
            <input type="text" id="renameSiteInputField" placeholder="New name for selected site" style="width:180px;">
            <button class="action-btn btn-rename" onclick="executeActiveSiteRename()">✏️ Rename Current Site</button>
        </div>
    </div>

    <div class="section-title"><span>📝 Day Time Office Logger</span></div>
    <div class="inputs-grid">
        <div class="input-group">
            <label>Worker Name</label>
            <input type="text" id="formWorkerName" placeholder="e.g. Raju" onkeyup="triggerWorkerProfileAutofill()">
        </div>
        <div class="input-group">
            <label>Daily Wages (₹)</label>
            <input type="number" id="formDailyWages" value="800" oninput="calculateLiveHourlyOtRate()">
        </div>
        <div class="input-group">
            <label>OT Pay / Hour (₹)</label>
            <input type="number" id="formHourlyOtRate" value="100" readonly style="background:#f1f5f9; font-weight:700; color:#475569;">
        </div>
        <div class="input-group">
            <label>Shift Type</label>
            <select id="formShiftMode" onchange="calculateLiveHourlyOtRate()">
                <option value="8hr">Normal Shift (8.0 Hr Target)</option>
                <option value="7hr">Short Shift (7.0 Hr Target)</option>
            </select>
        </div>
        <div class="input-group">
            <label>Date</label>
            <input type="date" id="formLogDate">
        </div>
        <div class="input-group">
            <label>In Time</label>
            <input type="time" id="formPunchIn" value="09:00">
        </div>
        <div class="input-group">
            <label>Lunch Out</label>
            <input type="time" id="formLunchOut" value="13:00">
        </div>
        <div class="input-group">
            <label>Lunch In</label>
            <input type="time" id="formLunchIn" value="14:00">
        </div>
        <div class="input-group">
            <label>Out Time</label>
            <input type="time" id="formPunchOut" value="17:00">
        </div>
        <div class="input-group">
            <label>Advance Taken (₹)</label>
            <input type="number" id="formAdvancePaid" value="0">
        </div>
    </div>
    <button class="btn-submit action-btn" onclick="commitFormEntryToDatabase()">💾 Save Log</button>

    <div class="block-tabs" id="site2SegmentTabsBlock" style="display:none;">
        <button class="tab-item tab-btn active" id="cycleTab1" onclick="shiftSite2DayCycleSegment(1)">Day 01-10</button>
        <button class="tab-item tab-btn" id="cycleTab2" onclick="shiftSite2DayCycleSegment(2)">Day 11-20</button>
        <button class="tab-item tab-btn" id="cycleTab3" onclick="shiftSite2DayCycleSegment(3)">Day 21-End</button>
    </div>

    <div class="section-title">
        <span>📊 Performance Matrix View:</span>
        <button class="action-btn btn-excel" onclick="exportToExcelOldSchool()">📥 Export to Excel</button>
    </div>
    <div class="grid-scroller">
        <table id="masterGridTable">
            <thead>
                <tr id="gridHeaderRow"></tr>
            </thead>
            <tbody id="gridBodyDataPool"></tbody>
        </table>
    </div>

    <div class="purge-panel">
        <div class="section-title" style="color:#dc2626; margin-top:0; border-left-color:#dc2626; font-size:14px;">⚠️ Delete Specific Entry (Galti Thik Karein)</div>
        <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;">
            <div class="input-group" style="flex:1; min-width:180px;">
                <label>Worker Name</label>
                <input type="text" id="purgeTargetName" placeholder="Enter name precisely">
            </div>
            <div class="input-group" style="flex:1; min-width:140px;">
                <label>Select Date</label>
                <input type="date" id="purgeTargetDate">
            </div>
            <button class="action-btn btn-purge" onclick="executeTargetRecordPurge()">🗑️ Delete This Date Entry</button>
        </div>
    </div>
</div>

<script>
    const BASE_REST_ENDPOINT = "https://shramiksync-default-rtdb.firebaseio.com/shramik_live_v12.json";
    const META_REST_ENDPOINT = "https://shramiksync-default-rtdb.firebaseio.com/shramik_meta_v12.json";

    let masterDB = { site1:{}, site2:{}, site3:{}, site4:{}, site5:{} };
    let siteNamesMap = { site1: "Site 1", site2: "Site 2 (10-Day Auto Block Payment)", site3: "Site 3", site4: "Site 4", site5: "Site 5" };
    let currentActiveSiteKey = 'site1';
    let currentSite2CycleSegment = 1;

    window.addEventListener('DOMContentLoaded', () => {
        let clock = new Date();
        let formattedIsoToday = `${clock.getFullYear()}-${String(clock.getMonth() + 1).padStart(2, '0')}-${String(clock.getDate()).padStart(2, '0')}`;
        
        document.getElementById('formLogDate').value = formattedIsoToday;
        document.getElementById('purgeTargetDate').value = formattedIsoToday;

        if(localStorage.getItem('shramik_custom_title_string')) {
            document.getElementById('appTitleText').value = localStorage.getItem('shramik_custom_title_string');
        }
        if(localStorage.getItem('shramik_site_names_dictionary')) {
            try { siteNamesMap = JSON.parse(localStorage.getItem('shramik_site_names_dictionary')); } catch(e){}
        }
        if(localStorage.getItem('shramik_unbreakable_local_cache')) {
            try { masterDB = JSON.parse(localStorage.getItem('shramik_unbreakable_local_cache')); } catch(e){}
        }

        synchronizeSiteSelectorsUI();
        calculateLiveHourlyOtRate();
        renderSystemInterfaceDynamicUI();
        
        pullCloudDatabaseState();
        setInterval(pullCloudDatabaseState, 3000);
    });

    function persistAppTitle() {
        localStorage.setItem('shramik_custom_title_string', document.getElementById('appTitleText').value);
    }

    function synchronizeSiteSelectorsUI() {
        Object.keys(siteNamesMap).forEach(key => {
            let optionElement = document.querySelector(`#activeSiteSelector option[value="${key}"]`);
            if(optionElement) { optionElement.innerText = siteNamesMap[key]; }
        });
    }

    function executeActiveSiteRename() {
        let newTitle = document.getElementById('renameSiteInputField').value.trim();
        if(!newTitle) { alert("❌ Name khali nahi chhoda ja sakta!"); return; }
        siteNamesMap[currentActiveSiteKey] = newTitle;
        localStorage.setItem('shramik_site_names_dictionary', JSON.stringify(siteNamesMap));
        synchronizeSiteSelectorsUI();
        document.getElementById('renameSiteInputField').value = '';
        
        fetch(META_REST_ENDPOINT, { method: 'PUT', body: JSON.stringify(siteNamesMap) })
            .then(() => renderSystemInterfaceDynamicUI());
    }

    function pullCloudDatabaseState() {
        fetch(BASE_REST_ENDPOINT)
            .then(res => res.json())
            .then(data => {
                if(data) {
                    masterDB = data;
                    localStorage.setItem('shramik_unbreakable_local_cache', JSON.stringify(masterDB));
                    renderSystemInterfaceDynamicUI();
                }
            }).catch(e => console.log("Offline backup running."));
    }

    function pushCurrentStateToCloud() {
        localStorage.setItem('shramik_unbreakable_local_cache', JSON.stringify(masterDB));
        renderSystemInterfaceDynamicUI();
        
        fetch(BASE_REST_ENDPOINT, {
            method: 'PUT',
            body: JSON.stringify(masterDB)
        }).catch(err => console.log("Local sync complete. Retry waiting."));
    }

    function calculateLiveHourlyOtRate() {
        let dailyWages = parseFloat(document.getElementById('formDailyWages').value) || 0;
        let shiftConfig = document.getElementById('formShiftMode').value;
        let baseDenominator = (shiftConfig === '7hr') ? 7.0 : 8.0; // PERFECT 8 HOUR SHIFT ASSIGNMENT
        document.getElementById('formHourlyOtRate').value = dailyWages > 0 ? Math.round(dailyWages / baseDenominator) : 0;
    }

    function triggerWorkerProfileAutofill() {
        let inputName = document.getElementById('formWorkerName').value.trim();
        let scopeCluster = masterDB[currentActiveSiteKey] || {};
        if(scopeCluster[inputName]) {
            document.getElementById('formDailyWages').value = scopeCluster[inputName].baseWages || 800;
            document.getElementById('formHourlyOtRate').value = scopeCluster[inputName].hourlyOtRate || 100;
            if(scopeCluster[inputName].shiftMode) { document.getElementById('formShiftMode').value = scopeCluster[inputName].shiftMode; }
        }
        calculateLiveHourlyOtRate();
    }

    function executeComplexAttendanceCalculations(inTime, lOut, lIn, outTime, dayWages, otRate, shiftConfig) {
        if(!inTime || !outTime) return { netHrs:0, otHrs:0, status:'A', earnedWages:0, earnedOt:0 };
        let tStart = new Date("2026-01-01 " + inTime);
        let tEnd = new Date("2026-01-01 " + outTime);
        let deltaDurationMs = tEnd - tStart;
        if(lOut && lIn) {
            let tLStart = new Date("2026-01-01 " + lOut);
            let tLEnd = new Date("2026-01-01 " + lIn);
            if(tLEnd > tLStart) deltaDurationMs -= (tLEnd - tLStart);
        }
        let calculatedNetWorkingHours = deltaDurationMs / 3600000;
        if(calculatedNetWorkingHours <= 0) return { netHrs:0, otHrs:0, status:'A', earnedWages:0, earnedOt:0 };
        
        let status = 'A', otHours = 0, wageEarnings = 0, otEarnings = 0;
        let evaluatedShiftThreshold = (shiftConfig === '7hr') ? 7.0 : 8.0; // LIVE CALCULATOR RUNNING ON 8.0 FIXED

        if (calculatedNetWorkingHours < evaluatedShiftThreshold) {
            status = 'HD'; 
            wageEarnings = calculatedNetWorkingHours * (dayWages / evaluatedShiftThreshold);
        } else {
            status = 'P';
            wageEarnings = dayWages;
            if(calculatedNetWorkingHours > evaluatedShiftThreshold) {
                otHours = calculatedNetWorkingHours - evaluatedShiftThreshold;
                otEarnings = otHours * otRate;
            }
        }
        return { netHrs: calculatedNetWorkingHours, otHrs: otHours, status: status, earnedWages: wageEarnings, earnedOt: otEarnings };
    }

    function renderSystemInterfaceDynamicUI() {
        document.getElementById('activeSiteSelector').value = currentActiveSiteKey;
        document.getElementById('activeWorkspaceBadge').innerText = "Site: " + siteNamesMap[currentActiveSiteKey];
        let cycleBar = document.getElementById('site2SegmentTabsBlock');
        if(currentActiveSiteKey === 'site2') { cycleBar.style.display = 'flex'; } else { cycleBar.style.display = 'none'; }
        generateLayoutSpreadsheetGridStructure();
    }

    function engageSiteWorkspaceSwitch() {
        currentActiveSiteKey = document.getElementById('activeSiteSelector').value;
        currentSite2CycleSegment = 1;
        document.querySelectorAll('.block-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
        if(document.getElementById('cycleTab1')) document.getElementById('cycleTab1').classList.add('active');
        renderSystemInterfaceDynamicUI();
    }

    function shiftSite2DayCycleSegment(segmentIndex) {
        currentSite2CycleSegment = segmentIndex;
        document.querySelectorAll('.block-tabs .tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('cycleTab' + segmentIndex).classList.add('active');
        renderSystemInterfaceDynamicUI();
    }

    function generateLayoutSpreadsheetGridStructure() {
        let headTrack = document.getElementById('gridHeaderRow');
        let rawHtmlHeaderString = '<th style="text-align:left; padding-left:10px; position: sticky; left: 0; z-index: 2; background: #f8fafc; border-right: 2px solid #cbd5e1;">Worker Name</th>';
        let startDay = 1, endDay = 31;
        if(currentActiveSiteKey === 'site2') {
            if(currentSite2CycleSegment === 1) { startDay = 1; endDay = 10; }
            else if(currentSite2CycleSegment === 2) { startDay = 11; endDay = 20; }
            else if(currentSite2CycleSegment === 3) { startDay = 21; endDay = 31; }
        }
        for(let loopDay = startDay; loopDay <= endDay; loopDay++) { rawHtmlHeaderString += `<th>Day ${String(loopDay).padStart(2,'0')}</th>`; }
        rawHtmlHeaderString += '<th style="background:#2563eb; color:white; min-width:170px;">Summary Block</th>';
        headTrack.innerHTML = rawHtmlHeaderString;
        bindTransactionalDataRowsToGrid(startDay, endDay);
    }

    function bindTransactionalDataRowsToGrid(dayStartBound, dayEndBound) {
        let dataGridBody = document.getElementById('gridBodyDataPool');
        dataGridBody.innerHTML = '';
        let activeSiteNodeMap = masterDB[currentActiveSiteKey] || {};
        let workerProfileKeysList = Object.keys(activeSiteNodeMap);

        if(workerProfileKeysList.length === 0) {
            dataGridBody.innerHTML = `<tr><td colspan="42" style="padding:20px; color:#64748b; font-size:12px; background:#f8fafc;">No data found in this area. Save details to create logs.</td></tr>`;
            return;
        }

        workerProfileKeysList.forEach(profileNameKey => {
            let dataObjectNode = activeSiteNodeMap[profileNameKey];
            let rowWrapperElement = document.createElement('tr');
            let cellHtmlString = `<td class="fixed-worker-cell" style="padding-left:10px;">👤 <span style="color:#0f172a; font-size:12px; font-weight:800;">${profileNameKey}</span><br><span style="color:#64748b; font-size:10px;">Wages: ₹${dataObjectNode.baseWages}/d</
