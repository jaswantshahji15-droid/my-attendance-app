<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shramik Sync Master v9.3</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f9; margin: 0; padding: 10px; color: #333; }
        .container { max-width: 100%; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2, h3 { color: #2c3e50; margin: 15px 0 10px 0; border-bottom: 2px solid #3498db; padding-bottom: 5px; font-size: 1.2rem; }
        .company-header { text-align: center; margin-bottom: 15px; background: #eef2f7; padding: 12px; border-radius: 6px; border-left: 5px solid #2ecc71; }
        .editable-title { margin: 0; font-size: 1.5rem; color: #2c3e50; font-weight: bold; }
        .site-panel { background: #ebf5fb; padding: 10px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #aed6f1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .site-label { font-size: 12px; font-weight: bold; color: #2c3e50; }
        .site-select { padding: 6px 10px; font-size: 13px; font-weight: bold; border-radius: 4px; border: 2px solid #3498db; background: white; color: #2c3e50; }
        .rename-btn { background-color: #34495e; color: white; padding: 6px 10px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; background: #f8f9fa; padding: 12px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #e9ecef; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 11px; font-weight: 600; margin-bottom: 3px; color: #495057; }
        input, select { padding: 6px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; }
        .search-container { margin: 10px 0; display: flex; flex-direction: column; gap: 8px; }
        .search-input { width: 100%; padding: 8px; border: 1px solid #b2bec3; border-radius: 4px; font-size: 13px; box-sizing: border-box; }
        .cycle-tabs { display: none; gap: 5px; margin-bottom: 10px; }
        .tab-btn { background: #bdc3c7; color: #2c3e50; padding: 6px 12px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #e67e22; color: white; }
        button { background-color: #3498db; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
        button:hover { background-color: #2980b9; }
        .btn-success { background-color: #2ecc71; }
        .btn-danger { background-color: #e74c3c; }
        .table-responsive { overflow-x: auto; margin-top: 10px; border: 1px solid #dee2e6; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: center; }
        th { background-color: #34495e; color: white; padding: 8px 4px; font-weight: 600; border: 1px solid #4f5d6c; }
        td { padding: 6px 4px; border: 1px solid #dee2e6; vertical-align: top; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .time-block { font-size: 9px; color: #444; text-align: left; background: #f1f3f5; padding: 4px; border-radius: 4px; margin-top: 3px; line-height: 1.3; border: 1px solid #dcdde1; }
        .status-p { color: #27ae60; font-weight: bold; font-size: 12px; }
        .status-hd { color: #f39c12; font-weight: bold; font-size: 12px; }
        .status-a { color: #c0392b; font-weight: bold; font-size: 12px; }
        .status-pp { color: #9b59b6; font-weight: bold; font-size: 12px; }
        .running-total { font-size: 9px; color: #1e8449; font-weight: bold; background: #e8f8f5; padding: 2px 3px; border-radius: 3px; margin-top: 3px; text-align: center; border: 1px dashed #2ecc71; }
        .summary-text { font-size: 10px; text-align: left; background: #e8f8f5; padding: 4px; border-radius: 3px; font-weight: 600; margin-top: 2px; border: 1px solid #a3e4d7; }
        .current-site-badge { background: #3498db; color: white; padding: 4px 8px; border-radius: 3px; font-size: 12px; font-weight: bold; }
        .sync-badge { font-size: 12px; color: #27ae60; font-weight: bold; margin-left: 10px; background: #e8f8f5; padding: 2px 6px; border-radius: 4px; border: 1px solid #2ecc71; }
        .delete-box { background: #fdf2f2; border: 1px solid #f5b7b1; padding: 12px; border-radius: 6px; margin-top: 20px; display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

<div class="container">
    <div class="company-header">
        <h1 id="mainTitle" class="editable-title">Shramik Sync Master v9.3</h1>
        <div style="margin-top: 8px;">
            <span class="current-site-badge"><span id="currentSiteLabel">Site 1</span></span>
            <span class="sync-badge" id="syncStatus">🟢 System Ready (Local Storage Active)</span>
        </div>
    </div>
    
    <div class="site-panel">
        <span class="site-label">📍 Select Working Site/Location:</span>
        <select id="siteSelector" class="site-select" onchange="switchSite()">
            <option value="site1" id="opt_site1">Site 1</option>
            <option value="site2" id="opt_site2">Site 2 (10-Day Cycle Mode)</option>
            <option value="site3" id="opt_site3">Site 3</option>
            <option value="site4" id="opt_site4">Site 4</option>
            <option value="site5" id="opt_site5">Site 5</option>
        </select>
        <button class="rename-btn" onclick="renameCurrentSite()">✏️ Rename Selected Site</button>
    </div>
    
    <h3>1. Daily Time Office Entry</h3>
    <div class="grid-form">
        <div class="form-group">
            <label>Worker Name</label>
            <input type="text" id="wName" placeholder="e.g. Ram" onkeyup="checkAndAutofillWorker()">
        </div>
        <div class="form-group">
            <label>Per Day Wages (₹)</label>
            <input type="number" id="wDayRate" value="1200" oninput="autoCalculateOTRate()">
        </div>
        <div class="form-group">
            <label>OT Rate/Hour (₹)</label>
            <input type="number" id="wHourRate" value="150">
        </div>
        <div class="form-group">
            <label>Shift Option</label>
            <select id="wShift">
                <option value="normal">Normal (8.5 Hr System)</option>
                <option value="7hr">7-Hour Shift System</option>
            </select>
        </div>
        <div class="form-group">
            <label>Select Date</label>
            <input type="date" id="wDate">
        </div>
        <div class="form-group">
            <label>In Time</label>
            <input type="time" id="wInTime" value="09:00">
        </div>
        <div class="form-group">
            <label>Lunch Out</label>
            <input type="time" id="wLunchOut" value="13:00">
        </div>
        <div class="form-group">
            <label>Lunch In</label>
            <input type="time" id="wLunchIn" value="14:00">
        </div>
        <div class="form-group">
            <label>Out Time</label>
            <input type="time" id="wOutTime" value="18:00">
        </div>
        <div class="form-group">
            <label>Advance Entry (₹)</label>
            <input type="number" id="wAdvance" value="0">
        </div>
        <div class="form-group" style="justify-content: flex-end;">
            <button class="btn-success" id="saveBtn" onclick="saveDailyAttendance()">Save Entry</button>
        </div>
    </div>

    <h3>2. Monthly Performance Register <span id="registerModeBadge" style="font-size:12px; color:#e67e22;"></span></h3>
    
    <div class="search-container">
        <div class="cycle-tabs" id="cycleTabsContainer">
            <button class="tab-btn active" id="tab1" onclick="switchCycleTab(1)">Cycle: Day 01-10</button>
            <button class="tab-btn" id="tab2" onclick="switchCycleTab(2)">Cycle: Day 11-20</button>
            <button class="tab-btn" id="tab3" onclick="switchCycleTab(3)">Cycle: Day 21-Month End</button>
        </div>
        <input type="text" id="wSearch" class="search-input" placeholder="🔍 Type worker name to filter sheet..." onkeyup="renderMonthlyTable()">
    </div>

    <div style="margin-bottom: 10px;">
        <button class="btn-success" onclick="exportToCSV()">💾 Download Excel (CSV)</button>
        <button class="btn-danger" onclick="clearAllData()">🗑️ Clear Current Site Data</button>
    </div>
    
    <div class="table-responsive">
        <table>
            <thead><tr id="tableHeaderDays"></tr></thead>
            <tbody id="monthlyTableBody"></tbody>
        </table>
    </div>

    <h3>⚠️ Delete Specific Entry</h3>
    <div class="delete-box">
        <div class="form-group">
            <label>Worker Name</label>
            <input type="text" id="delName" placeholder="Name to delete...">
        </div>
        <div class="form-group">
            <label>Select Date</label>
            <input type="date" id="delDate">
        </div>
        <button class="btn-danger" onclick="deleteSpecificSingleEntry()">🗑️ Delete This Date Entry</button>
    </div>
</div>

<script>
    let allSitesRecords = { site1: {}, site2: {}, site3: {}, site4: {}, site5: {} };
    let currentSite = 'site1';
    let siteNames = { site1: "Site 1", site2: "Site 2 (10-Day Cycle Mode)", site3: "Site 3", site4: "Site 4", site5: "Site 5" };
    let activeCycleTab = 1;

    function getFormattedTodayDate() {
        let today = new Date();
        let yyyy = today.getFullYear();
        let mm = String(today.getMonth() + 1).padStart(2, '0');
        let dd = String(today.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    // Explicit Initialization sequence to prevent script crashing on mobile view load
    document.addEventListener("DOMContentLoaded", function() {
        currentSite = localStorage.getItem('current_selected_site') || 'site1';
        let savedRecords = localStorage.getItem('shramik_records');
        let savedNames = localStorage.getItem('shramik_site_names');
        if(savedRecords) allSitesRecords = JSON.parse(savedRecords);
        if(savedNames) siteNames = JSON.parse(savedNames);
        
        let finalDateStr = getFormattedTodayDate();
        document.getElementById('wDate').value = finalDateStr;
        document.getElementById('delDate').value = finalDateStr;
        
        refreshSiteUiAndTables();
    });

    function saveAllDataToCloudAndLocal() {
        localStorage.setItem('shramik_records', JSON.stringify(allSitesRecords));
        localStorage.setItem('shramik_site_names', JSON.stringify(siteNames));
        refreshSiteUiAndTables();
    }

    function refreshSiteUiAndTables() {
        let sel = document.getElementById('siteSelector');
        if(!sel) return;
        sel.value = currentSite;

        for(let i=1; i<=5; i++) {
            let opt = document.getElementById(`opt_site${i}`);
            if(opt) opt.innerText = siteNames[`site${i}`];
        }
        
        document.getElementById('currentSiteLabel').innerText = "Active Site: " + siteNames[currentSite];
        
        let tabsCont = document.getElementById('cycleTabsContainer');
        let bdg = document.getElementById('registerModeBadge');
        
        if(currentSite === 'site2') {
            if(tabsCont) tabsCont.style.display = 'flex';
            if(bdg) bdg.innerText = "(⚠️ 10-Day Split Mode Active)";
        } else {
            if(tabsCont) tabsCont.style.display = 'none';
            if(bdg) bdg.innerText = "(Full Month View)";
        }
        
        generateTableHeader();
        renderMonthlyTable();
    }

    function switchSite() {
        currentSite = document.getElementById('siteSelector').value;
        localStorage.setItem('current_selected_site', currentSite);
        activeCycleTab = 1; 
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        let t1 = document.getElementById('tab1');
        if(t1) t1.classList.add('active');
        refreshSiteUiAndTables();
    }

    function switchCycleTab(tabNum) {
        activeCycleTab = tabNum;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        let t = document.getElementById('tab' + tabNum);
        if(t) t.classList.add('active');
        generateTableHeader();
        renderMonthlyTable();
    }

    function renameCurrentSite() {
        let oldName = siteNames[currentSite];
        let newName = prompt(`Apni select ki hui [${oldName}] ka naya naam dalein:`, oldName);
        if (newName && newName.trim() !== "") {
            siteNames[currentSite] = newName.trim();
            saveAllDataToCloudAndLocal();
        }
    }

    function autoCalculateOTRate() {
        let dayRate = parseFloat(document.getElementById('wDayRate').value) || 0;
        document.getElementById('wHourRate').value = dayRate > 0 ? (Math.round((dayRate / 8) * 10) / 10) : 0;
    }

    function generateTableHeader() {
        const headerRow = document.getElementById('tableHeaderDays');
        if(!headerRow) return;
        
        let html = '<th style="text-align:left; min-width:130px;">Worker Details</th>';
        
        let startDay = 1, endDay = 31;
        if(currentSite === 'site2') {
            if(activeCycleTab === 1) { startDay = 1; endDay = 10; }
            else if(activeCycleTab === 2) { startDay = 11; endDay = 20; }
            else if(activeCycleTab === 3) { startDay = 21; endDay = 31; }
        }

        for (let i = startDay; i <= endDay; i++) {
            let dayStr = i < 10 ? '0' + i : i;
            html += `<th style="min-width:115px;">Day ${dayStr}</th>`;
        }
        
        html += `<th style="min-width:150px; background:#2c3e50;">Summary & Net Payable</th>`;
        headerRow.innerHTML = html;
    }

    function checkAndAutofillWorker() {
        const nameInput = document.getElementById('wName').value.trim();
        let currentSiteData = allSitesRecords[currentSite] || {};
        if(currentSiteData[nameInput]) {
            document.getElementById('wDayRate').value = currentSiteData[nameInput].dayRate;
            document.getElementById('wHourRate').value = currentSiteData[nameInput].hourRate;
            if(currentSiteData[nameInput].shiftType) {
                document.getElementById('wShift').value = currentSiteData[nameInput].shiftType;
            }
        }
    }

    function calculateHours(inT, lOut, lIn, outT) {
        if(!inT || !outT) return 0;
        let start = new Date("2026-01-01 " + inT), end = new Date("2026-01-01 " + outT);
        let diffMs = end - start;
        if(lOut && lIn) {
            let lStart = new Date("2026-01-01 " + lOut), lEnd = new Date("2026-01-01 " + lIn);
            if(lEnd > lStart) diffMs -= (lEnd - lStart);
        }
        return diffMs / (1000 * 60 * 60) > 0 ? diffMs / (1000 * 60 * 60) : 0;
    }

    function formatToHoursMinutes(decimalHours) {
        if (decimalHours <= 0) return "00:00";
        let hrs = Math.floor(decimalHours), mins = Math.round((decimalHours - hrs) * 60);
        if (mins === 60) { hrs += 1; mins = 0; }
        return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
    }

    function saveDailyAttendance() {
        const name = document.getElementById('wName').value.trim();
        const dayRate = parseFloat(document.getElementById('wDayRate').value) || 0;
        const hourRate = parseFloat(document.getElementById('wHourRate').value) || 0;
        const shiftType = document.getElementById('wShift').value;
        let dateVal = document.getElementById('wDate').value;
        const inTime = document.getElementById('wInTime').value;
        const lunchOut = document.getElementById('wLunchOut').value;
        const lunchIn = document.getElementById('wLunchIn').value;
        const outTime = document.getElementById('wOutTime').value;
        const advance = parseFloat(document.getElementById('wAdvance').value) || 0;

        if(!name) { alert("Bhai, Worker ka Naam daalna zaroori hai!"); return; }
        if(!dateVal || dateVal === "") dateVal = getFormattedTodayDate();

        let dateParts = dateVal.split('-');
        let dayInt = dateParts[2] ? parseInt(dateParts[2]) : new Date().getDate();
        const dayStr = dayInt < 10 ? '0' + dayInt : '' + dayInt;

        let totalHours = calculateHours(inTime, lunchOut, lunchIn, outTime);
        let status = "A"; let otHours = 0; let earnedWages = 0; let otWagesEarned = 0;

        if(shiftType === '7hr') {
            if (totalHours >= 12) {
                status = "P+P"; earnedWages = dayRate * 2; otHours = 0;
            } else if (totalHours >= 9.5) {
                status = "P"; earnedWages = dayRate; otWagesEarned = dayRate * 0.5; otHours = totalHours - 7;
            } else if (totalHours >= 5.5) {
                status = "P"; earnedWages = dayRate;
                if (totalHours > 7) { otHours = totalHours - 7; otWagesEarned = otHours * hourRate; }
            } else {
                status = "HD"; earnedWages = totalHours * (dayRate / 7);
            }
        } else {
            if (totalHours >= 13.5) {
                status = "P+P"; earnedWages = dayRate * 2; otHours = 0;
            } else if (totalHours >= 11) {
                status = "P"; earnedWages = dayRate; otWagesEarned = dayRate * 0.5; otHours = totalHours - 8.5; 
            } else if (totalHours >= 7) {
                status = "P"; earnedWages = dayRate;
                if (totalHours > 8.5) { otHours = totalHours - 8.5; otWagesEarned = otHours * hourRate; }
            } else {
                status = "HD"; earnedWages = totalHours * (dayRate / 8);
            }
        }

        if (totalHours === 0) { status = "A"; earnedWages = 0; otWagesEarned = 0; }

        if(!allSitesRecords[currentSite]) allSitesRecords[currentSite] = {};
        let currentSiteData = allSitesRecords[currentSite];

        if(!currentSiteData[name]) {
            currentSiteData[name] = { dayRate, hourRate, shiftType, dates: {}, advances: {} };
        }
        
        let wRecord = currentSiteData[name];
        wRecord.dayRate = dayRate; wRecord.hourRate = hourRate; wRecord.shiftType = shiftType;
        
        if(!wRecord.advances) wRecord.advances = {};
        if(advance > 0) {
            wRecord.advances[dayStr] = (wRecord.advances[dayStr] || 0) + advance;
        }

        if(!wRecord.dates) wRecord.dates = {};
        wRecord.dates[dayStr] = { 
            inTime, lunchOut, lunchIn, outTime, 
            hoursWorked: totalHours, otHours, status, 
            earnedWages, otWagesEarned 
        };

        saveAllDataToCloudAndLocal();
        document.getElementById('wName').value = '';
        document.getElementById('wAdvance').value = '0';
        alert("Entry Successfully Save Ho Gayi Hai!");
    }

    function deleteSpecificSingleEntry() {
        const name = document.getElementById('delName').value.trim();
        let dateVal = document.getElementById('delDate').value;

        if(!name) { alert("Please type Worker Name!"); return; }
        if(!dateVal || dateVal === "") dateVal = getFormattedTodayDate();

        let dateParts = dateVal.split('-');
        let dayInt = dateParts[2] ? parseInt(dateParts[2]) : new Date().getDate();
        const dayStr = dayInt < 10 ? '0' + dayInt : '' + dayInt;

        let currentSiteData = allSitesRecords[currentSite] || {};
        if(!currentSiteData[name]) { alert(`Worker "${name}" nahi mila!`); return; }

        if((currentSiteData[name].dates && currentSiteData[name].dates[dayStr]) || (currentSiteData[name].advances && currentSiteData[name].advances[dayStr])) {
            if(confirm(`Kya aap ${name} ka Date: ${dayStr} ka data permanently clear karna chahte hain?`)) {
                if(currentSiteData[name].dates) delete currentSiteData[name].dates[dayStr];
