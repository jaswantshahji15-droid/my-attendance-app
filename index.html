<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Performance & Attendance Register</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            padding: 10px;
            color: #333;
        }
        .container {
            max-width: 100%;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2, h3 {
            color: #2c3e50;
            margin: 5px 0 10px 0;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
            font-size: 1.2rem;
        }
        .company-header {
            text-align: center;
            margin-bottom: 15px;
            background: #eef2f7;
            padding: 10px;
            border-radius: 6px;
        }
        .company-header h1 { margin: 0; font-size: 1.4rem; color: #2c3e50; }
        .company-header p { margin: 4px 0 0 0; font-size: 12px; color: #7f8c8d; }
        
        .grid-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #e9ecef;
        }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 11px; font-weight: 600; margin-bottom: 3px; color: #495057; }
        input, select { padding: 6px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; outline: none; }
        
        /* Search Box */
        .search-container { margin: 10px 0; }
        .search-input { width: 100%; padding: 8px; border: 1px solid #b2bec3; border-radius: 4px; font-size: 13px; }

        button {
            background-color: #3498db; color: white; border: none; padding: 8px 12px;
            border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px;
        }
        button:hover { background-color: #2980b9; }
        .btn-success { background-color: #2ecc71; }
        .btn-success:hover { background-color: #27ae60; }
        .btn-danger { background-color: #e74c3c; }
        .btn-danger:hover { background-color: #c0392b; }
        
        /* Professional Matrix Table Style */
        .table-responsive {
            overflow-x: auto;
            margin-top: 10px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
        }
        table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: center; }
        th { background-color: #34495e; color: white; padding: 6px 4px; font-weight: 600; border: 1px solid #4f5d6c; }
        td { padding: 5px 4px; border: 1px solid #dee2e6; vertical-align: top; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        /* Inner Blocks for In/Out Timings */
        .time-block { font-size: 9px; color: #555; text-align: left; background: #f1f3f5; padding: 2px; border-radius: 3px; margin-top: 2px; line-height: 1.1; }
        .status-p { color: #27ae60; font-weight: bold; }
        .status-hd { color: #f39c12; font-weight: bold; }
        .status-a { color: #c0392b; font-weight: bold; }
        
        .summary-text { font-size: 10px; text-align: left; background: #e8f8f5; padding: 3px; border-radius: 3px; font-weight: 600; margin-top: 2px; }
        .wages-text { font-size: 10px; text-align: left; background: #fef9e7; padding: 3px; border-radius: 3px; font-weight: 600; margin-top: 2px; color: #b7950b; }
    </style>
</head>
<body>

<div class="container">
    <div class="company-header">
        <h1>Adventures India Pvt. Ltd.</h1>
        <p><strong>Performance Register (Monthly View)</strong></p>
    </div>
    
    <h3>1. Daily Time Office Entry</h3>
    <div class="grid-form">
        <div class="form-group">
            <label>Worker Name</label>
            <input type="text" id="wName" placeholder="e.g. Chandresh">
        </div>
        <div class="form-group">
            <label>Per Day Wages (₹)</label>
            <input type="number" id="wDayRate" value="500">
        </div>
        <div class="form-group">
            <label>OT Rate/Hour (₹)</label>
            <input type="number" id="wHourRate" value="70">
        </div>
        <div class="form-group">
            <label>Select Date</label>
            <input type="date" id="wDate">
        </div>
        <div class="form-group">
            <label>In Time</label>
            <input type="time" id="wInTime" value="09:00">
        </div>
        <div class="form-group">
            <label>Lunch Out</label>
            <input type="time" id="wLunchOut" value="13:00">
        </div>
        <div class="form-group">
            <label>Lunch In</label>
            <input type="time" id="wLunchIn" value="14:00">
        </div>
        <div class="form-group">
            <label>Out Time</label>
            <input type="time" id="wOutTime" value="18:00">
        </div>
        <div class="form-group">
            <label>Advance (₹)</label>
            <input type="number" id="wAdvance" value="0">
        </div>
        <div class="form-group" style="justify-content: flex-end;">
            <button class="btn-success" onclick="saveDailyAttendance()">Save Entry</button>
        </div>
    </div>

    <h3>2. Monthly Performance Register</h3>
    
    <div class="search-container">
        <input type="text" id="wSearch" class="search-input" placeholder="🔍 Type worker name to filter..." onkeyup="renderMonthlyTable()">
    </div>

    <div>
        <button onclick="exportToCSV()">💾 Download Excel (CSV)</button>
        <button class="btn-danger" onclick="clearAllData()">🗑️ Clear All Data</button>
    </div>
    
    <div class="table-responsive">
        <table>
            <thead>
                <tr id="tableHeaderDays">
                    </tr>
            </thead>
            <tbody id="monthlyTableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    // Master database Structure: { 'Worker Name': { dayRate, hourRate, advance, dates: { '01': {in, out, status, etc} } } }
    let monthlyData = JSON.parse(localStorage.getItem('monthly_payroll_records')) || {};

    window.onload = function() {
        document.getElementById('wDate').value = new Date().toISOString().split('T')[0];
        generateTableHeader();
        renderMonthlyTable();
    };

    function generateTableHeader() {
        const headerRow = document.getElementById('tableHeaderDays');
        let html = '<th style="text-align:left; min-width:120px;">Worker Details</th>';
        for (let i = 1; i <= 31; i++) {
            let dayStr = i < 10 ? '0' + i : i;
            html += `<th style="min-width:70px;">${dayStr}</th>`;
        }
        html += '<th style="min-width:100px; background:#2c3e50;">Monthly Summary & Net Payable</th>';
        headerRow.innerHTML = html;
    }

    function calculateHours(inT, lOut, lIn, outT) {
        if(!inT || !outT) return 0;
        let start = new Date("2026-01-01 " + inT);
        let end = new Date("2026-01-01 " + outT);
        let diffMs = end - start;
        
        // Lunch deduction
        if(lOut && lIn) {
            let lStart = new Date("2026-01-01 " + lOut);
            let lEnd = new Date("2026-01-01 " + lIn);
            if(lEnd > lStart) diffMs -= (lEnd - lStart);
        }
        
        let diffHrs = diffMs / (1000 * 60 * 60);
        return diffHrs > 0 ? diffHrs : 0;
    }

    function saveDailyAttendance() {
        const name = document.getElementById('wName').value.trim();
        const dayRate = parseFloat(document.getElementById('wDayRate').value) || 0;
        const hourRate = parseFloat(document.getElementById('wHourRate').value) || 0;
        const dateVal = document.getElementById('wDate').value;
        const inTime = document.getElementById('wInTime').value;
        const lunchOut = document.getElementById('wLunchOut').value;
        const lunchIn = document.getElementById('wLunchIn').value;
        const outTime = document.getElementById('wOutTime').value;
        const advance = parseFloat(document.getElementById('wAdvance').value) || 0;

        if(!name || !dateVal) { alert("Please enter Name and select Date!"); return; }

        // Extract day '01', '02' etc.
        const dayStr = dateVal.split('-')[2];

        let totalHours = calculateHours(inTime, lunchOut, lunchIn, outTime);
        
        // --- AUTOMATIC STATUS RULES ---
        let status = "A"; 
        let otHours = 0;

        if (totalHours >= 8) {
            status = "P"; // Present
            otHours = totalHours - 8; // Overtime above 8 hours auto calculate
        } else if (totalHours >= 3 && totalHours <= 4) {
            status = "HD"; // Half Day auto calculation
        } else if (totalHours > 0) {
            status = "P"; // General Present if between 4 and 8 hours (or customize as needed)
            if(totalHours < 4 && totalHours > 0) status = "A"; // Less than 3 hours is Absent
        }

        // Initialize worker if not exists
        if(!monthlyData[name]) {
            monthlyData[name] = { dayRate, hourRate, totalAdvance: 0, dates: {} };
        }
        
        // Update rates and advance
        monthlyData[name].dayRate = dayRate;
        monthlyData[name].hourRate = hourRate;
        if(advance > 0) {
            monthlyData[name].totalAdvance += advance;
        }

        // Add daily log
        monthlyData[name].dates[dayStr] = {
            inTime, lunchOut, lunchIn, outTime,
            hoursWorked: totalHours,
            otHours: otHours,
            status: status
        };

        localStorage.setItem('monthly_payroll_records', JSON.stringify(monthlyData));
        
        // Clear fields
        document.getElementById('wName').value = '';
        document.getElementById('wAdvance').value = '0';
        
        alert(`Entry Saved for ${name} on day ${dayStr}!`);
        renderMonthlyTable();
    }

    function renderMonthlyTable() {
        const tbody = document.getElementById('monthlyTableBody');
        tbody.innerHTML = '';
        const searchQ = document.getElementById('wSearch').value.toLowerCase().trim();

        for (let workerName in monthlyData) {
            if(searchQ && !workerName.toLowerCase().includes(searchQ)) continue;

            let worker = monthlyData[workerName];
            let tr = document.createElement('tr');
            
            // Col 1: Worker Info
            let rowHtml = `<td style="text-align:left; font-weight:bold; background:#eaeded;">
                ${workerName}<br>
                <span style="font-size:10px;color:#7f8c8d;">Rate: ₹${worker.dayRate}/d<br>OT: ₹${worker.hourRate}/hr</span>
            </td>`;

            let totalPresent = 0;
            let totalHalfDay = 0;
            let totalOTHours = 0;

            // Col 2 to 32: Days 01 to 31
            for (let i = 1; i <= 31; i++) {
                let dayStr = i < 10 ? '0' + i : '' + i;
                let dayData = worker.dates[dayStr];

                if(dayData) {
                    let stClass = dayData.status === 'P' ? 'status-p' : (dayData.status === 'HD' ? 'status-hd' : 'status-a');
                    
                    if(dayData.status === 'P') totalPresent++;
                    if(dayData.status === 'HD') totalHalfDay++;
                    totalOTHours += dayData.otHours;

                    let otText = dayData.otHours > 0 ? `<br><span style="color:#e67e22;font-weight:bold;">OT:${dayData.otHours.toFixed(1)}h</span>` : '';

                    rowHtml += `<td>
                        <span class="${stClass}">${dayData.status}</span>
                        <div class="time-block">
                            I: ${dayData.inTime}<br>
                            L: ${dayData.lunchOut}-${dayData.lunchIn}<br>
                            O: ${dayData.outTime}<br>
                            H: ${dayData.hoursWorked.toFixed(1)}h
                        </div>
                        ${otText}
                    </td>`;
                } else {
                    rowHtml += `<td><span style="color:#bdc3c7;">-</span></td>`;
                }
            }

            // Calculations
            let baseWages = (totalPresent * worker.dayRate) + (totalHalfDay * (worker.dayRate / 2));
            let otWages = totalOTHours * worker.hourRate;
            let grossWages = baseWages + otWages;
            let netPayable = grossWages - worker.totalAdvance;

            // Final Summary Column
            rowHtml += `<td style="background:#f4f6f6; text-align:left;">
                <div class="summary-text">P: ${totalPresent} | HD: ${totalHalfDay}</div>
                <div class="summary-text" style="background:#fdf2e9;">Tot OT: ${totalOTHours.toFixed(1)} hrs</div>
                <div class="wages-text">Base ₹: ${baseWages.toFixed(0)}</div>
                <div class="wages-text">OT ₹: ${otWages.toFixed(0)}</div>
                <div class="wages-text" style="background:#d4efdf; color:#196f3d;">Gross: ₹${grossWages.toFixed(0)}</div>
                <div class="wages-text" style="background:#fadbd8; color:#78281f;">Adv Less: ₹${worker.totalAdvance.toFixed(0)}</div>
                <div class="wages-text" style="background:#2ecc71; color:white; font-size:11px; text-align:center;">Net: ₹${netPayable.toFixed(0)}</div>
            </td>`;

            tr.innerHTML = rowHtml;
            tbody.appendChild(tr);
        }
    }

    function clearAllData() {
        if(confirm("⚠️ Kya aap poore mahine ka sabhi workers ka data delete karna chahte hain?")) {
            monthlyData = {};
            localStorage.removeItem('monthly_payroll_records');
            renderTable();
            renderMonthlyTable();
        }
    }

    function exportToCSV() {
        if(Object.keys(monthlyData).length === 0) { alert("No data to export!"); return; }
        
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += "Worker Name,Day Rate,OT Rate,";
        for(let i=1; i<=31; i++) csvContent += `Day ${i},`;
        csvContent += "Total Present,Total HalfDay,Total OT Hours,Gross Wages,Advance Less,Net Payable\n";

        for (let name in monthlyData) {
            let worker = monthlyData[name];
            let totalPresent = 0, totalHalfDay = 0, totalOTHours = 0;
            
            let rowStr = `"${name}",${worker.dayRate},${worker.hourRate},`;
            
            for(let i=1; i<=31; i++) {
                let dayStr = i < 10 ? '0' + i : '' + i;
                let d = worker.dates[dayStr];
                if(d) {
                    rowStr += `"${d.status} (${d.hoursWorked.toFixed(1)}h)",`;
                    if(d.status === 'P') totalPresent++;
                    if(d.status === 'HD') totalHalfDay++;
                    totalOTHours += d.otHours;
                } else {
                    rowStr += `"-",`;
                }
            }
            
            let baseWages = (totalPresent * worker.dayRate) + (totalHalfDay * (worker.dayRate / 2));
            let otWages = totalOTHours * worker.hourRate;
            let gross = baseWages + otWages;
            let net = gross - worker.totalAdvance;

            rowStr += `${totalPresent},${totalHalfDay},${totalOTHours.toFixed(1)},${gross},${worker.totalAdvance},${net}\n`;
            csvContent += rowStr;
        }

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Monthly_Performance_Report.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
