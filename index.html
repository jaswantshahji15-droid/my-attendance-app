<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sync Multi-Site Attendance & 10-Day Payroll</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f9; margin: 0; padding: 10px; color: #333; }
        .container { max-width: 100%; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2, h3 { color: #2c3e50; margin: 5px 0 10px 0; border-bottom: 2px solid #3498db; padding-bottom: 5px; font-size: 1.2rem; }
        .company-header { text-align: center; margin-bottom: 15px; background: #eef2f7; padding: 12px; border-radius: 6px; border-left: 5px solid #2ecc71; }
        .editable-title { margin: 0; font-size: 1.5rem; color: #2c3e50; font-weight: bold; display: inline-block; padding: 2px 8px; border-radius: 4px; cursor: pointer; }
        .site-panel { background: #ebf5fb; padding: 10px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #aed6f1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .site-label { font-size: 12px; font-weight: bold; color: #2c3e50; }
        .site-select { padding: 6px 10px; font-size: 13px; font-weight: bold; border-radius: 4px; border: 2px solid #3498db; background: white; color: #2c3e50; outline: none; }
        .rename-btn { background-color: #34495e; color: white; padding: 6px 10px; font-size: 11px; border-radius: 4px; border: none; cursor: pointer; }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; background: #f8f9fa; padding: 12px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #e9ecef; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 11px; font-weight: 600; margin-bottom: 3px; color: #495057; }
        input, select { padding: 6px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; outline: none; }
        .search-container { margin: 10px 0; }
        .search-input { width: 100%; padding: 8px; border: 1px solid #b2bec3; border-radius: 4px; font-size: 13px; }
        button { background-color: #3498db; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
        button:hover { background-color: #2980b9; }
        .btn-success { background-color: #2ecc71; }
        .btn-danger { background-color: #e74c3c; }
        .table-responsive { overflow-x: auto; margin-top: 10px; border: 1px solid #dee2e6; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: center; }
        th { background-color: #34495e; color: white; padding: 6px 4px; font-weight: 600; border: 1px solid #4f5d6c; }
        td { padding: 5px 4px; border: 1px solid #dee2e6; vertical-align: top; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .time-block { font-size: 9px; color: #555; text-align: left; background: #f1f3f5; padding: 2px; border-radius: 3px; margin-top: 2px; line-height: 1.1; }
        .status-p { color: #27ae60; font-weight: bold; }
        .status-hd { color: #f39c12; font-weight: bold; }
        .status-a { color: #c0392b; font-weight: bold; }
        .status-pp { color: #9b59b6; font-weight: bold; }
        .summary-text { font-size: 10px; text-align: left; background: #e8f8f5; padding: 3px; border-radius: 3px; font-weight: 600; margin-top: 2px; }
        .wages-text { font-size: 10px; text-align: left; background: #fef9e7; padding: 3px; border-radius: 3px; font-weight: 600; margin-top: 2px; color: #b7950b; }
        .current-site-badge { background: #e74c3c; color: white; padding: 2px 6px; border-radius: 3px; font-size: 11px; font-weight: bold; }
        .cycle-header-1 { background-color: #2980b9 !important; }
        .cycle-header-2 { background-color: #8e44ad !important; }
        .cycle-header-3 { background-color: #d35400 !important; }
        .cycle-box { border: 1px dashed #7f8c8d; padding: 4px; margin-bottom: 4px; border-radius: 4px;}
        .cycle-title { font-weight: bold; font-size: 10px; text-align: center; color: white; border-radius: 3px; padding: 2px; margin-bottom: 3px;}
        .sync-badge { font-size: 11px; color: #27ae60; font-weight: bold; margin-left: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="company-header">
        <h1 id="mainTitle" class="editable-title" contenteditable="true" onblur="saveHeaderName()">Shramik Sync</h1>
        <div style="margin-top: 5px;">
            <span class="current-site-badge">Active Site: <span id="currentSiteLabel">Site 1</span></span>
            <span class="sync-badge" id="syncStatus">🔄 Live Connected</span>
        </div>
    </div>
    
    <div class="site-panel">
        <span class="site-label">📍 Select Working Site/Location:</span>
        <select id="siteSelector" class="site-select" onchange="switchSite()">
            <option value="site1" id="opt_site1">Site 1</option>
            <option value="site2" id="opt_site2">Site 2 (10-Day Cycle)</option>
            <option value="site3" id="opt_site3">Site 3</option>
            <option value="site4" id="opt_site4">Site 4</option>
            <option value="site5" id="opt_site5">Site 5</option>
        </select>
        <button class="rename-btn" onclick="renameCurrentSite()">✏️ Rename Selected Site</button>
    </div>
    
    <h3>1. Daily Time Office Entry</h3>
    <div class="grid-form">
        <div class="form-group">
            <label>Worker Name</label>
            <input type="text" id="wName" placeholder="e.g. Ram" onkeyup="checkAndAutofillWorker()">
        </div>
        <div class="form-group">
            <label>Per Day Wages (₹)</label>
            <input type="number" id="wDayRate" value="500" oninput="autoCalculateOTRate()">
        </div>
        <div class="form-group">
            <label>OT Rate/Hour (₹)</label>
            <input type="number" id="wHourRate" value="62.5">
        </div>
        <div class="form-group">
            <label>Shift Option</label>
            <select id="wShift">
                <option value="normal">Normal (8 Hr Duty)</option>
                <option value="7hr">7-Hour Shift</option>
            </select>
        </div>
        <div class="form-group">
            <label>Select Date</label>
            <input type="date" id="wDate">
        </div>
        <div class="form-group">
            <label>In Time</label>
            <input type="time" id="wInTime" value="09:00">
        </div>
        <div class="form-group">
            <label>Lunch Out</label>
            <input type="time" id="wLunchOut" value="13:00">
        </div>
        <div class="form-group">
            <label>Lunch In</label>
            <input type="time" id="wLunchIn" value="14:00">
        </div>
        <div class="form-group">
            <label>Out Time</label>
            <input type="time" id="wOutTime" value="18:00">
        </div>
        <div class="form-group">
            <label>Advance (₹)</label>
            <input type="number" id="wAdvance" value="0">
        </div>
        <div class="form-group" style="justify-content: flex-end;">
            <button class="btn-success" id="saveBtn" onclick="saveDailyAttendance()">Save Entry</button>
        </div>
    </div>

    <h3>2. Monthly Performance Register <span id="registerModeBadge" style="font-size:12px; color:#e74c3c;"></span></h3>
    <div class="search-container">
        <input type="text" id="wSearch" class="search-input" placeholder="🔍 Type worker name to filter sheet..." onkeyup="renderMonthlyTable()">
    </div>

    <div>
        <button onclick="exportToCSV()">💾 Download Excel (CSV)</button>
        <button class="btn-danger" onclick="clearAllData()">🗑️ Clear Current Site Data</button>
    </div>
    
    <div class="table-responsive">
        <table>
            <thead><tr id="tableHeaderDays"></tr></thead>
            <tbody id="monthlyTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const FIREBASE_DB_URL = "https://shramiksync-default-rtdb.firebaseio.com/";

    let allSitesRecords = { site1: {}, site2: {}, site3: {}, site4: {}, site5: {} };
    let currentSite = localStorage.getItem('current_selected_site') || 'site1';
    let siteNames = { site1: "Site 1", site2: "Site 2 (10-Day Cycle)", site3: "Site 3", site4: "Site 4", site5: "Site 5" };

    window.onload = function() {
        document.getElementById('wDate').value = new Date().toISOString().split('T')[0];
        loadLiveFirebaseData();
    };

    function loadLiveFirebaseData() {
        document.getElementById('syncStatus').innerText = "🔄 Syncing...";
        document.getElementById('syncStatus').style.color = "#f39c12";

        fetch(FIREBASE_DB_URL + "/.json")
        .then(res => res.json())
        .then(data => {
            if(data) {
                if(data.records) allSitesRecords = data.records;
                if(data.siteNames) siteNames = data.siteNames;
                if(data.appTitle) document.getElementById('mainTitle').innerText = data.appTitle;
            }
            loadSiteSettings();
            generateTableHeader();
            renderMonthlyTable();
            document.getElementById('syncStatus').innerText = "🟢 Live Connected";
            document.getElementById('syncStatus').style.color = "#27ae60";
        })
        .catch(err => {
            console.error(err);
            document.getElementById('syncStatus').innerText = "🔴 Offline Mode";
            document.getElementById('syncStatus').style.color = "#c0392b";
        });
    }

    function saveToFirebase() {
        let payload = { records: allSitesRecords, siteNames: siteNames, appTitle: document.getElementById('mainTitle').innerText.trim() };
        fetch(FIREBASE_DB_URL + "/.json", {
            method: "PUT",
            body: JSON.stringify(payload)
        }).then(() => {
            generateTableHeader();
            renderMonthlyTable();
            document.getElementById('syncStatus').innerText = "🟢 Live Connected";
        });
    }

    function loadSiteSettings() {
        document.getElementById('siteSelector').value = currentSite;
        for(let i=1; i<=5; i++) {
            document.getElementById(`opt_site${i}`).innerText = siteNames[`site${i}`];
        }
        document.getElementById('currentSiteLabel').innerText = siteNames[currentSite];
        document.getElementById('registerModeBadge').innerText = (currentSite === 'site2') ? "(⚠️ 10-Day Split Mode Active)" : "(Full Month Mode)";
    }

    function switchSite() {
        currentSite = document.getElementById('siteSelector').value;
        localStorage.setItem('current_selected_site', currentSite);
        loadSiteSettings();
        generateTableHeader();
        renderMonthlyTable();
    }

    function renameCurrentSite() {
        let oldName = siteNames[currentSite];
        let newName = prompt(`Apni select ki hui [${oldName}] ka naya naam dalein:`, oldName);
        if (newName && newName.trim() !== "") {
            siteNames[currentSite] = newName.trim();
            saveToFirebase();
        }
    }

    function saveHeaderName() {
        saveToFirebase();
    }

    function autoCalculateOTRate() {
        const dayRate = parseFloat(document.getElementById('wDayRate').value) || 0;
        document.getElementById('wHourRate').value = dayRate > 0 ? (Math.round((dayRate / 8) * 10) / 10) : 0;
    }

    function generateTableHeader() {
        const headerRow = document.getElementById('tableHeaderDays');
        let html = '<th style="text-align:left; min-width:120px;">Worker Details</th>';
        for (let i = 1; i <= 31; i++) {
            let dayStr = i < 10 ? '0' + i : i;
            let cycleClass = (currentSite === 'site2') ? (i <= 10 ? "class='cycle-header-1'" : (i <= 20 ? "class='cycle-header-2'" : "class='cycle-header-3'")) : "";
            html += `<th ${cycleClass} style="min-width:75px;">${dayStr}</th>`;
        }
        html += `<th style="min-width:${currentSite === 'site2' ? '140px' : '120px'}; background:#2c3e50;">${currentSite === 'site2' ? '10-Day Cycle Wise Split Breakup' : 'Monthly Summary & Net Payable'}</th>`;
        headerRow.innerHTML = html;
    }

    function checkAndAutofillWorker() {
        const nameInput = document.getElementById('wName').value.trim();
        let currentSiteData = allSitesRecords[currentSite] || {};
        if(currentSiteData[nameInput]) {
            document.getElementById('wDayRate').value = currentSiteData[nameInput].dayRate;
            document.getElementById('wHourRate').value = currentSiteData[nameInput].hourRate;
            document.getElementById('wShift').value = currentSiteData[nameInput].shiftType || 'normal';
        }
    }

    function calculateHours(inT, lOut, lIn, outT) {
        if(!inT || !outT) return 0;
        let start = new Date("2026-01-01 " + inT), end = new Date("2026-01-01 " + outT);
        let diffMs = end - start;
        if(lOut && lIn) {
            let lStart = new Date("2026-01-01 " + lOut), lEnd = new Date("2026-01-01 " + lIn);
            if(lEnd > lStart) diffMs -= (lEnd - lStart);
        }
        return diffMs / (1000 * 60 * 60) > 0 ? diffMs / (1000 * 60 * 60) : 0;
    }

    function formatToHoursMinutes(decimalHours) {
        if (decimalHours <= 0) return "00:00";
        let hrs = Math.floor(decimalHours), mins = Math.round((decimalHours - hrs) * 60);
        if (mins === 60) { hrs += 1; mins = 0; }
        return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
    }

    function saveDailyAttendance() {
        const name = document.getElementById('wName').value.trim();
        const dayRate = parseFloat(document.getElementById('wDayRate').value) || 0;
        const hourRate = parseFloat(document.getElementById('wHourRate').value) || 0;
        const shiftType = document.getElementById('wShift').value;
        const dateVal = document.getElementById('wDate').value;
        const inTime = document.getElementById('wInTime').value;
        const lunchOut = document.getElementById('wLunchOut').value;
        const lunchIn = document.getElementById('wLunchIn').value;
        const outTime = document.getElementById('wOutTime').value;
        const advance = parseFloat(document.getElementById('wAdvance').value) || 0;

        if(!name || !dateVal) { alert("Please enter Name and select Date!"); return; }

        const dayInt = parseInt(dateVal.split('-')[2]);
        const dayStr = dayInt < 10 ? '0' + dayInt : '' + dayInt;
        let cycleId = dayInt <= 10 ? 1 : (dayInt <= 20 ? 2 : 3);

        let totalHours = calculateHours(inTime, lunchOut, lunchIn, outTime);
        let status = "A"; let otHours = 0; let earnedWages = 0; let otWagesEarned = 0;

        if (shiftType === '7hr') {
            if (totalHours >= 7) { status = "P"; earnedWages = dayRate; otHours = totalHours - 7; otWagesEarned = otHours * hourRate; }
            else if (totalHours >= 6.5 && totalHours < 7) { status = "P"; earnedWages = dayRate; }
            else { status = totalHours >= 3.5 ? "HD" : "A"; earnedWages = totalHours * (dayRate / 7); }
        } else {
            if (totalHours >= 14) { status = "P+P"; earnedWages = dayRate * 2; otHours = totalHours - 8; otWagesEarned = otHours * hourRate; }
            else if (totalHours >= 11 && totalHours < 14) { status = "P+P"; earnedWages = dayRate * 1.5; otHours = totalHours - 8; otWagesEarned = otHours * hourRate; }
            else if (totalHours >= 8 && totalHours < 11) { status = "P"; earnedWages = dayRate; otHours = totalHours - 8; otWagesEarned = otHours * hourRate; }
            else if (totalHours >= 7 && totalHours < 8) { status = "P"; earnedWages = dayRate; }
            else { status = (totalHours >= 3 && totalHours <= 4) ? "HD" : (totalHours > 4 ? "P" : "A"); earnedWages = totalHours * (dayRate / 8); }
        }
        if (totalHours === 0) status = "A";

        if(!allSitesRecords[currentSite]) allSitesRecords[currentSite] = {};
        let currentSiteData = allSitesRecords[currentSite];

        if(!currentSiteData[name]) {
            currentSiteData[name] = { dayRate, hourRate, shiftType, totalAdvance: 0, cycle1Advance: 0, cycle2Advance: 0, cycle3Advance: 0, dates: {} };
        }
        
        let wRecord = currentSiteData[name];
        wRecord.dayRate = dayRate; wRecord.hourRate = hourRate; wRecord.shiftType = shiftType;
        
        if(advance > 0) {
            wRecord.totalAdvance += advance;
            if(cycleId === 1) wRecord.cycle1Advance += advance;
            else if(cycleId === 2) wRecord.cycle2Advance += advance;
            else wRecord.cycle3Advance += advance;
        }

        wRecord.dates[dayStr] = { inTime, lunchOut, lunchIn, outTime, hoursWorked: totalHours, otHours, status, earnedWages, otWagesEarned };

        document.getElementById('saveBtn').innerText = "Saving...";
        saveToFirebase();
        document.getElementById('wName').value = '';
        document.getElementById('wAdvance').value = '0';
        document.getElementById('saveBtn').innerText = "Save Entry";
    }

    function renderMonthlyTable() {
        const tbody = document.getElementById('monthlyTableBody');
        tbody.innerHTML = '';
        const searchQ = document.getElementById('wSearch').value.toLowerCase().trim();
        let currentSiteData = allSitesRecords[currentSite] || {};

        for (let workerName in currentSiteData) {
            if(searchQ && !workerName.toLowerCase().includes(searchQ)) continue;

            let worker = currentSiteData[workerName];
            let tr = document.createElement('tr');
            let shiftLabel = worker.shiftType === '7hr' ? '7-Hr Shift' : 'Normal';
            
            let rowHtml = `<td style="text-align:left; font-weight:bold; background:#eaeded;">
                ${workerName}<br><span style="font-size:10px;color:#7f8c8d;">Rate: ₹${worker.dayRate}/d<br>OT: ₹${worker.hourRate}/hr<br><b style="color:#2980b9;">${shiftLabel}</b></span>
            </td>`;

            let mPresent = 0, mHD = 0, mAbsent = 0, mPP = 0, mOT = 0, mBaseWages = 0, mOTWages = 0;
            let c1 = { p:0, pp:0, hd:0, base:0, otWages:0 }, c2 = { p:0, pp:0, hd:0, base:0, otWages:0 }, c3 = { p:0, pp:0, hd:0, base:0, otWages:0 };

            for (let i = 1; i <= 31; i++) {
                let dayStr = i < 10 ? '0' + i : '' + i;
                let dayData = worker.dates ? worker.dates[dayStr] : null;

                if(dayData) {
                    if(dayData.status === 'P') { mPresent++; if(i<=10) c1.p++; else if(i<=20) c2.p++; else c3.p++; }
                    else if(dayData.status === 'HD') { mHD++; if(i<=10) c1.hd++; else if(i<=20) c2.hd++; else c3.hd++; }
                    else if(dayData.status === 'P+P') { mPP++; if(i<=10) c1.pp++; else if(i<=20) c2.pp++; else c3.pp++; }
                    else { mAbsent++; }
                    
                    mOT += dayData.otHours; mBaseWages += dayData.earnedWages || 0; mOTWages += dayData.otWagesEarned || 0;
                    if(i <= 10) { c1.base += dayData.earnedWages; c1.otWages += dayData.otWagesEarned; }
                    else if(i <= 20) { c2.base += dayData.earnedWages; c2.otWages += dayData.otWagesEarned; }
                    else { c3.base += dayData.earnedWages; c3.otWages += dayData.otWagesEarned; }

                    let otText = dayData.otHours > 0 ? `<br><span style="color:#e67e22;font-weight:bold;">OT:${formatToHoursMinutes(dayData.otHours)}</span>` : '';
                    rowHtml += `<td><span class="${dayData.status === 'P' ? 'status-p' : (dayData.status === 'HD' ? 'status-hd' : (dayData.status==='P+P'?'status-pp':'status-a'))}">${dayData.status}</span>
                        <div class="time-block">I: ${dayData.inTime}<br>O: ${dayData.outTime}<br><b>H: ${formatToHoursMinutes(dayData.hoursWorked)}</b></div>${otText}</td>`;
